# Redes segregadas (ISO 27001 A.9 / OWASP):
#   edge    — expuesta al host: frontend (nginx, loopback) y kong (loopback).
#   backend — internal: kong ↔ backend ↔ redis.
#   data    — internal: backend ↔ postgres (+ redis de cache).
#   egress_proxy — internal: backend ↔ egress-proxy.
#   egress  — con salida a Internet, SOLO para egress-proxy (squid con lista
#             blanca, ver egress-proxy/squid.conf). El backend llega a Saman a
#             través de él (SAMAN_HTTPS_PROXY); no tiene egreso directo.
# Ningún servicio de `data`/`backend` tiene egreso a internet ni puertos
# publicados (excepto el loopback del kong para el reverse proxy del host).
services:
  postgres:
    image: postgres:16-alpine
    container_name: pwa-postgres
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD (openssl rand -base64 48)}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
    # Sin puertos publicados al host: solo backend/migraciones lo alcanzan
    # por la red interna de Docker.
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pwa-redis
    restart: unless-stopped
    networks: [data, backend]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD (openssl rand -base64 32)}
    # maxmemory: policy allkeys-lru (cache/rate-limit/challenges), evicting
    # primero las claves menos usadas — protege contra un run-away de
    # rate-limit counters bajo ataque sin llenar el disco/AOF.
    command:
      - sh
      - -c
      - redis-server --appendonly yes --maxmemory 160mb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Proxy de salida con lista blanca (egress-proxy/squid.conf): única vía del
  # backend hacia Internet, solo HTTPS a los destinos permitidos (Saman).
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: pwa-egress-proxy
    restart: unless-stopped
    networks: [egress_proxy, egress]
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pwa-backend
    restart: unless-stopped
    networks: [backend, data, egress_proxy]
    env_file:
      - ./backend/.env.prod
    environment:
      # Salida a Saman por el proxy con lista blanca (sin egreso directo).
      SAMAN_HTTPS_PROXY: http://egress-proxy:3128
    # Migraciones automáticas en cada deploy, antes de levantar el servidor.
    # Se ejecutan con DB_MIGRATE_AS_OWNER=true para conectar como DB_USER
    # (owner, puede hacer DDL) aunque el runtime use DB_APP_USER. Las variables
    # DB_APP_* siguen visibles para que RlsHardening pueda crear el rol.
    command:
      - sh
      - -c
      - DB_MIGRATE_AS_OWNER=true npx typeorm migration:run -d dist/database/data-source.js && node dist/main
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      egress-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # node ya corre como usuario no-root en la imagen; sin capabilities en runtime.
    cap_drop: [ALL]

  kong:
    image: kong:3.6
    container_name: pwa-kong
    restart: unless-stopped
    networks: [edge, backend]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET (openssl rand -base64 48)}
      KONG_CORS_ORIGINS: ${KONG_CORS_ORIGINS:?Define KONG_CORS_ORIGINS, ej. ["https://tu-dominio.com"]}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD}
      KONG_METRICS_API_KEY: ${KONG_METRICS_API_KEY:?Define KONG_METRICS_API_KEY (openssl rand -base64 32)}
      # El reverse proxy del host es el peer inmediato (loopback): confiar su
      # X-Forwarded-For para que el rate-limit use la IP real del cliente y no
      # 127.0.0.1 (que compartiría un único contador para todos).
      KONG_TRUSTED_IPS: "127.0.0.1"
      KONG_REAL_IP_HEADER: "X-Forwarded-For"
    volumes:
      - ./backend/kong:/kong
    entrypoint: ["/bin/sh", "/kong/start.sh"]
    # Solo publicado a loopback: exclusivamente el reverse proxy del host lo
    # alcanza. El admin API (8001) queda interno al contenedor.
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: pwa-frontend
    restart: unless-stopped
    networks: [edge]
    # Solo loopback: el reverse proxy del host sirve TLS y rutea al contenedor.
    # Este nginx (puerto 8080, no-root sin NET_BIND_SERVICE) solo sirve el
    # build estático (dist + SW/PWA); no conoce Kong.
    ports:
      - "127.0.0.1:8080:8080"
    # Menor superficie de ataque: rootfs de solo-lectura + sin capabilities;
    # /tmp como tmpfs para los paths temporales de nginx.
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=101,gid=101,mode=1777
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  egress_proxy:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  pgdata:
  redisdata: