# Proxy de salida del backend (ver docker-compose*.yml, servicio egress-proxy).
#
# El backend vive en redes internas sin salida a Internet. Sus únicas llamadas
# externas pasan por aquí, y solo se permite HTTPS (CONNECT al 443) a los
# destinos de la lista blanca. TLS sigue siendo extremo a extremo: el proxy no
# lo descifra, solo abre el túnel.
#
# Para habilitar otro servicio externo, agregarlo a allowed_hosts y reiniciar
# el contenedor egress-proxy.

http_port 3128

# Lista blanca de destinos (algoritmo de estudio de crédito, SAMAN_API_URL).
acl allowed_hosts dstdomain saman-eng.net

acl SSL_port port 443
acl CONNECT method CONNECT

http_access deny !SSL_port
http_access deny !CONNECT
http_access allow CONNECT allowed_hosts
http_access deny all

# Sin caché: solo túneles.
cache deny all
