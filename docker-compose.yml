# Redes segregadas (ISO 27001 A.9 / OWASP):
#   edge    — expuesta al host: frontend (vite) y kong. Único frontal.
#   backend — internal (sin egreso a internet): kong ↔ backend ↔ redis.
#   data    — internal: backend ↔ postgres (+ redis legado, ver abajo).
# Publicamos puertos al host SOLO desde servicios de `edge`/publicados a
# loopback para el desarrollo nativo (WSL): postgres 5433, redis 6379.
#
# Redis vive en `backend` y `data` porque sigue usándose como cache de
# rate-limit/métricas por Kong y como redis del backend; aun así NUNCA está
# en `edge` (no expuesto fuera de Docker salvo su puerto a loopback).
services:
  postgres:
    image: postgres:16-alpine
    container_name: pwa-postgres
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pwa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwa_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pwa_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pwa_user} -d ${POSTGRES_DB:-pwa_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pwa-redis
    restart: unless-stopped
    networks: [data, backend]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en el .env raiz del proyecto}
    command:
      - sh
      - -c
      - redis-server --appendonly yes --maxmemory 160mb --maxmemory-policy allkeys-lru --requirepass "$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: pwa-backend
    restart: unless-stopped
    networks: [backend, data]
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    # SIN volumen anónimo de node_modules: el contenedor usa directamente el
    # node_modules del host vía el bind mount ./backend:/app. Así un rebuild
    # de imagen NUNCA deja un volume stale con dependencias viejas (el error
    # 'Cannot find module prom-client' venía de un anonymous volume que
    # cacheaba el node_modules de la imagen anterior y sombreaba al host).
    # Importante: el target `development` del Dockerfile usa node:20
    # (Debian/glibc), igual que el host WSL — los módulos nativos del host
    # (bcrypt) cargan sin segfault (bajo alpine/musl un .node glibc crashea
    # con exit 139 al ejecutar bcrypt.compare). Prod sigue en alpine con su
    # propio node_modules dentro de la imagen.
    # Al añadir una dep nueva: corre `bun install`/`npm ci` en el host
    # y luego el rebuild. Nada de --renew-anon-volumes.
    volumes:
      - ./backend:/app
    # node corre de serie como usuario no-root en la imagen; sin capabilities
    # adicionales en dev+prod.
    cap_drop: [ALL]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: pwa-frontend
    restart: unless-stopped
    networks: [edge]
    environment:
      VITE_PROXY_TARGET: http://kong:8000
    ports:
      - "127.0.0.1:5173:5173"
    # SIN volumen anónimo de node_modules (mismo criterio que backend): el dev
    # usa node:20 Debian/glibc (mismo libc que WSL), así el node_modules del
    # host (incluido esbuild linux-x64) funciona directo. Sin volumen stale el
    # rebuild no puede dejar dependencias desactualizadas.
    # Al añadir una dep nueva: `bun install`/`npm install` en frontend/ y rebuild.
    volumes:
      - ./frontend:/app
    depends_on:
      kong:
        condition: service_healthy

  kong:
    image: kong:3.6
    container_name: pwa-kong
    restart: unless-stopped
    networks: [edge, backend]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET en el .env raiz del proyecto}
      KONG_CORS_ORIGINS: ${KONG_CORS_ORIGINS:-'["http://localhost:5173"]'}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en el .env raiz del proyecto}
      KONG_METRICS_API_KEY: ${KONG_METRICS_API_KEY:?Define KONG_METRICS_API_KEY en el .env raiz del proyecto}
    volumes:
      - ./backend/kong:/kong
    entrypoint: ["/bin/sh", "/kong/start.sh"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata: